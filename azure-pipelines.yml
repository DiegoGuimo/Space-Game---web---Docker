trigger:
- '*'

variables:
  buildConfiguration: 'Release'
  webRepository: 'tailspin-web'
  tag: '$(Build.BuildId)'
  wwwrootDir: 'Tailspin.SpaceGame.Web/wwwroot'
  dotnetSdkVersion: '8.x'
  containerRegistry: 'tailspinspacegame26514.azurecr.io'
  azureSubscription: 'Resource Manager - Tailspin - Space Game'

stages:
- stage: 'Build'
  displayName: 'Build the web application'
  jobs: 
  - job: 'Build'
    displayName: 'Build job'
    pool:
      name: RetoAzure
      demands:
      - agent.name -equals MyAgent

    steps:
    # ✅ Cambio a `scriptType: batch` para evitar error de `pwsh`
    - task: AzureCLI@2
      displayName: 'Login to Azure Container Registry'
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: batch
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(containerRegistry)

    # 🔹 Construcción y push de la imagen Docker usando `cmd.exe`
    - task: CmdLine@2
      displayName: 'Build and push the Docker image'
      inputs:
        script: |
          docker build -t $(containerRegistry)/$(webRepository):$(tag) -f $(Build.SourcesDirectory)/Tailspin.SpaceGame.Web/Dockerfile .
          docker push $(containerRegistry)/$(webRepository):$(tag)

- stage: 'Deploy'
  displayName: 'Deploy the container'
  dependsOn: Build
  jobs:
  - job: 'Deploy'
    displayName: 'Deploy job'
    pool:
      name: RetoAzure
      demands:
      - agent.name -equals MyAgent
    variables:
    - group: Release
    steps:
    - task: AzureWebAppContainer@1
      displayName: 'Deploy to Azure App Service'
      inputs:
        azureSubscription: $(azureSubscription)
        appName: $(WebAppName)
        containers: '$(containerRegistry)/$(webRepository):$(tag)'
