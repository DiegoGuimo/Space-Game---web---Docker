trigger:
- '*'

variables:
  buildConfiguration: 'Release'
  webRepository: 'tailspin-web'
  tag: '$(Build.BuildId)'
  acrName: 'tailspinspacegame26514'  # 🔹 Nombre del ACR sin el dominio .azurecr.io
  loginServer: 'tailspinspacegame26514.azurecr.io'
  azureSubscription: 'Resource Manager - Tailspin - Space Game'

stages:
- stage: 'Build'
  displayName: 'Construcción de la aplicación web'
  jobs: 
  - job: 'Build'
    displayName: 'Tarea de construcción'
    pool:
      name: RetoAzure
      demands:
      - agent.name -equals MyAgent

    steps:
    - task: AzureCLI@2
      displayName: 'Autenticar en Azure Container Registry'
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Autenticando en ACR..."
          TOKEN=$(az acr login --name $(acrName) --expose-token --query accessToken --output tsv)
          echo "Iniciando sesión en Docker..."
          echo $TOKEN | docker login $(loginServer) -u "00000000-0000-0000-0000-000000000000" --password-stdin

    - script: |
        echo "Construyendo la imagen..."
        docker build -t $(loginServer)/$(webRepository):$(tag) -f $(Build.SourcesDirectory)/Tailspin.SpaceGame.Web/Dockerfile $(Build.SourcesDirectory)
        echo "Enviando la imagen a ACR..."
        docker push $(loginServer)/$(webRepository):$(tag)
      displayName: 'Construir y enviar la imagen a ACR'
