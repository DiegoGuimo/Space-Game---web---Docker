trigger:
- '*'

variables:
  buildConfiguration: 'Release'
  webRepository: 'tailspin-web'  # Nombre de la imagen en ACR
  tag: '$(Build.BuildId)'
  wwwrootDir: 'Tailspin.SpaceGame.Web/wwwroot'
  dotnetSdkVersion: '8.x'
  containerRegistry: 'tailspinspacegame26514.azurecr.io'  # URL de tu ACR
  azureSubscription: 'Resource Manager - Tailspin - Space Game'  # Conexión Azure RM

stages:
- stage: 'Build'
  displayName: 'Build the web application'
  jobs: 
  - job: 'Build'
    displayName: 'Build job'
    pool:
      name: RetoAzure
      demands:
      - agent.name -equals MyAgent

    steps:
    - task: AzureCLI@2
      displayName: 'Login to Azure Container Registry'
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(containerRegistry)

    - task: PowerShell@2
      displayName: 'Build and push the Docker image'
      inputs:
        targetType: inline
        script: |
          docker build -t $(containerRegistry)/$(webRepository):$(tag) -f $(Build.SourcesDirectory)/Tailspin.SpaceGame.Web/Dockerfile .
          docker push $(containerRegistry)/$(webRepository):$(tag)

- stage: 'Deploy'
  displayName: 'Deploy the container'
  dependsOn: Build
  jobs:
  - job: 'Deploy'
    displayName: 'Deploy job'
    pool:
      name: RetoAzure
      demands:
      - agent.name -equals MyAgent
    variables:
    - group: Release  # Importa la Library "Release"
    steps:
    - task: AzureWebAppContainer@1
      displayName: 'Deploy to Azure App Service'
      inputs:
        azureSubscription: $(azureSubscription)
        appName: $(WebAppName)  # Usamos la variable de Library
        containers: '$(containerRegistry)/$(webRepository):$(tag)'
