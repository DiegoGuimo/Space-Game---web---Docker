trigger:
- '*'

variables:
  buildConfiguration: 'Release'
  webRepository: 'tailspin-web'  # Nombre de la imagen en ACR
  tag: '$(Build.BuildId)'
  wwwrootDir: 'Tailspin.SpaceGame.Web/wwwroot'
  dotnetSdkVersion: '8.x'
  containerRegistry: 'tailspinspacegame26514.azurecr.io'  # Nombre del ACR
  azureSubscription: 'Resource Manager - Tailspin - Space Game'  # Conexión Azure RM
  acrName: 'tailspinspacegame26514'
  loginServer: 'tailspinspacegame26514.azurecr.io'

stages:
- stage: 'Build'
  displayName: 'Build the web application'
  jobs: 
  - job: 'Build'
    displayName: 'Build job'
    pool:
      name: RetoAzure
      demands:
      - agent.name -equals MyAgent

    steps:
    - task: UseDotNet@2
      displayName: 'Instalar .NET SDK $(dotnetSdkVersion)'
      inputs:
        packageType: 'sdk'
        version: '$(dotnetSdkVersion)'

    - task: DotNetCoreCLI@2
      displayName: 'Restaurar dependencias'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Compilar aplicación'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    - task: AzureCLI@2
      displayName: 'Autenticar en Azure Container Registry'
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: 'pscore'  # 🟢 PowerShell Core en lugar de Bash
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Autenticando en ACR..."
          $TOKEN = az acr login --name $(acrName) --expose-token --query accessToken --output tsv
          Write-Host "Iniciando sesión en Docker..."
          $TOKEN | docker login $(loginServer) -u "00000000-0000-0000-0000-000000000000" --password-stdin

    - task: Docker@2
      displayName: 'Build y Push de la imagen a ACR'
      inputs:
        command: 'buildAndPush'
        repository: $(webRepository)
        dockerfile: '$(Build.SourcesDirectory)/Tailspin.SpaceGame.Web/Dockerfile'
        containerRegistry: '$(containerRegistry)'
        tags: |
          $(tag)

- stage: 'Deploy'
  displayName: 'Deploy the container'
  dependsOn: Build
  jobs:
  - job: 'Deploy'
    displayName: 'Deploy job'
    pool:
      name: RetoAzure
      demands:
      - agent.name -equals MyAgent
    variables:
    - group: Release  # 🔹 Importa la Library "Release"

    steps:
    - task: AzureWebAppContainer@1
      displayName: 'Deploy to Azure App Service'
      inputs:
        azureSubscription: $(azureSubscription)
        appName: $(WebAppName)  # Usamos la variable de Library
        containers: '$(containerRegistry)/$(webRepository):$(tag)'
